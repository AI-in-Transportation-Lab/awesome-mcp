name: Deploy site

# Runs when the site or its data changes on main, and when the daily update
# commits new papers (that job starts this one). Nothing runs on a quiet day.
on:
  push:
    branches: [main]
    paths: ["site/**", "data/**", "benchmark/results/**", "scripts/build-site.js", "scripts/lib/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build and deploy are separate jobs, as in GitHub's own Pages workflow. Deploying in
  # the same job as the upload sometimes failed with "0 artifacts found".
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - run: node scripts/build-site.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

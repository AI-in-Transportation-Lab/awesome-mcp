name: Update papers

# One short job a day. The scripts use only Node's standard library, which is
# already on the runner, so there is no setup or install step.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # lets the job start the Pages deploy when something changed

concurrency:
  group: update-papers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch, validate and regenerate
        env:
          # Optional free key from openalex.org; without it the shared anonymous quota applies.
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          node scripts/update-papers.js
          node scripts/update-published.js
          node scripts/validate.js
          node scripts/build-readme.js
      - name: Commit and deploy only if something changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No new papers."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.json data/published.json README.md PAPERS.md PUBLISHED.md SURVEY.md
          git commit -m "papers: update from arXiv and OpenAlex ($(date -u +%Y-%m-%d))"
          git push
          gh workflow run pages.yml --ref main

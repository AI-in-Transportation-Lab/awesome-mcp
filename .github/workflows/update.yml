name: Update papers

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch new papers from arXiv
        run: node scripts/update-papers.js
      - name: Validate data
        run: node scripts/validate.js
      - name: Regenerate README and PAPERS.md
        run: node scripts/build-readme.js
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No new papers."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.json README.md PAPERS.md
          git commit -m "papers: update from arXiv ($(date -u +%Y-%m-%d))"
          git push
